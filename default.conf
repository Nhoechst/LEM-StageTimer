server {
    # Use the Pelican allocation port; keep 80 for a tunnel targeting port 80.
    listen 2601;
    server_name _;
    root /home/container/www;
    index index.html;
    charset utf-8;

    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 8m;
    client_body_timeout 120s;

    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        try_files $uri =404;
    }
    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }
    location = /ping {
        rewrite ^ /ping.php last;
    }

    # Only these two entry points may execute PHP.
    location ~ ^/(api|ping)\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/home/container/tmp/php-fpm.sock;
        fastcgi_read_timeout 300s;
    }

    # Publish only built assets, never source, backups, or SQLite/photo storage.
    location ~ ^/(assets/[A-Za-z0-9_-]+\.(js|css)|logos/[A-Za-z0-9_-]+\.(svg|png))$ {
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
